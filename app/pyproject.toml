[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hcp"
version = "0.1.0"
description = "Reference implementation of the Human Context Protocol (HCP)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HCP contributors" }]
keywords = ["hcp", "context", "protocol", "markdown", "ai", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.21",
  "ruff>=0.6",
]

[project.scripts]
hcp = "hcp.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/hcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "git: tests that require the git binary",
  "slow: slower end-to-end tests",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
