name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Reference implementation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[dev]"

      - name: Format check
        run: .venv/bin/python -m ruff format --check src tests scripts

      - name: Lint
        run: .venv/bin/python -m ruff check src tests scripts

      - name: Tests
        run: .venv/bin/python -m pytest -q

      - name: Schema conformance
        run: .venv/bin/python -m pytest tests/test_schemas.py -q

      - name: End-to-end demo
        run: .venv/bin/python scripts/demo.py
